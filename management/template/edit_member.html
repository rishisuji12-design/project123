{% extends "management/base.html" %}

{% block title %}Edit Member{% endblock %}

{% block content %}

<h1>Edit Member</h1>

<form method="POST">

    {% csrf_token %}

    <label>Name:</label>
    <input type="text"
           name="name"
           value="{{ member.name }}"
           required>

    <br><br>

    <label>Email:</label>
    <input type="email"
           name="email"
           value="{{ member.email }}"
           required>

    <br><br>

    <label>Phone:</label>
    <input type="text"
           name="phone"
           value="{{ member.phone }}"
           required>

    <br><br>

    <label>Address:</label>

    <textarea name="address" required>{{ member.address }}</textarea>

    <br><br>

    <button type="submit">
        Update Member
    </button>

</form>

{% endblock %}
